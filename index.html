<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBPORTPOILO | GLASS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="glass-theme">
    <header class="site-header">
        <h1 class="centered-logo">WEBPORTPOILO</h1>
    </header>

    <section class="main-video-section">
        <div class="video-container">
            <video autoplay loop muted playsinline id="hero-video">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-man-running-on-the-spot-in-front-of-a-white-wall-4161-large.mp4" type="video/mp4">
            </video>
            <div class="video-overlay-text">NEVER STOP</div>
        </div>
    </section>

    <main class="content-container">
        <!-- 나의 소개 섹션 -->
        <section class="intro-section" id="about">
            <div class="side-label">나의 소개</div>
            <div class="content-box glass-card large-box about-container">
                <div id="about-content" class="about-info">
                    <p class="placeholder-text">이곳에 소개 내용을 입력하거나 PDF 파일을 업로드하세요.</p>
                </div>
                <button class="glass-btn" onclick="document.getElementById('about-file-input').click()">소개 PDF 업로드</button>
                <input type="file" id="about-file-input" accept=".pdf" style="display: none;">
            </div>
        </section>

        <!-- 프로젝트 그리드 섹션 -->
        <section class="projects-grid-section">
            <div class="projects-grid" id="projects-container">
                <!-- JS가 카드를 생성합니다 -->
            </div>
        </section>
        
        <!-- 숨겨진 프로젝트 파일 입력기 -->
        <input type="file" id="direct-project-file-input" style="display: none;">
    </main>

    <footer class="footer">
        <p>&copy; 2026 WEBPORTPOILO. Glass Design Evolution.</p>
        <button id="clear-storage" class="reset-link">초기화</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
