<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBPORTPOILO | KAKAO LOGIN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap"
        rel="stylesheet">
    <!-- 카카오 SDK 추가 - 안정적인 1.x 버전 -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/1.43.0/kakao.min.js"></script>
</head>

<body class="glass-theme dark-mode">
    <header class="site-header">
        <div class="header-left"></div>
        <h1 class="centered-logo">WEBPORTPOILO</h1>
        
        <!-- 로그인 제어 컨테이너 (드롭다운 포함) -->
        <div class="auth-ui-container">
            <div id="logged-out-view">
                <button class="kakao-simple-btn" onclick="loginWithKakao()">카카오</button>
            </div>
            <div id="logged-in-view" style="display: none;">
                <div class="profile-dropdown-container">
                    <div id="user-profile-trigger" class="user-profile" onclick="toggleProfileMenu()">
                        <img id="user-avatar" src="" alt="P" class="avatar-img">
                        <span id="user-nickname" class="nickname-text"></span>
                    </div>
                    <!-- 클릭 시 나타나는 사이드 메뉴 스타일 드롭다운 -->
                    <div id="profile-side-menu" class="dropdown-menu glass-card">
                        <button class="logout-link underline" onclick="logoutWithKakao()">LOGOUT</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="content-container">
        <!-- 상단으로 이동한 나의 소개 -->
        <section class="intro-section" id="about">
            <div class="section-header-flex">
                <div class="side-label">나의 소개</div>
                <!-- 편집 버튼 (로그인 시 노출) -->
                <button class="mini-edit-btn edit-mode-trigger" title="편집" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
            <div class="large-box glass-card" id="about-slot-container">
                <div id="about-display-area">
                </div>
                <input type="file" id="about-file-input" accept=".pdf,image/*" style="display: none;">
            </div>
        </section>

        <!-- 옆으로 넘기는 프로젝트 슬라이더 -->
        <section class="projects-slider-section">
            <div class="slider-header">
                <div class="section-header-flex">
                    <div class="side-label">프로젝트</div>
                    <!-- 편집 버튼 (로그인 시 노출) -->
                    <button class="mini-edit-btn edit-mode-trigger" title="편집" style="display: none;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="slider-wrapper">
                <button class="slider-nav-btn prev" id="prev-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="projects-horizontal-track" id="projects-container">
                    <!-- JS가 슬라이드 아이템을 생성합니다 -->
                </div>
                <button class="slider-nav-btn next" id="next-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
            <div style="text-align: center; margin-top: 2rem; opacity: 0.1; font-size: 0.5rem; letter-spacing: 5px;">
                DRAG TO EXPLORE
            </div>
        </section>

        <input type="file" id="direct-project-file-input" style="display: none;">
    </main>

    <footer class="footer">
        <p>&copy; 2026 WEBPORTPOILO</p>
        <button id="clear-storage" class="reset-link" style="display: none;">데이터 초기화</button>
    </footer>

    <script src="app.js"></script>
</body>

</html>
